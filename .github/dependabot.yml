version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # Includes the joshuadavidnelson/ci callers; @v1 is a moving major tag,
  # so those only change on a new major.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
