version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    target-branch: "stable"
    schedule:
      interval: "weekly"
    groups:
      composer:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "stable"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns:
          - "*"
