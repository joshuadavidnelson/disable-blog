name: "E2E Tests"

on:
  pull_request:
  workflow_dispatch: null

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  static:
    name: "Typecheck and compat unit tests"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v7"

    - name: "Setup Node.js"
      uses: "actions/setup-node@v7"
      with:
        node-version: "24"
        cache: "npm"

    - name: "Install npm dependencies"
      run: "npm ci"

    - name: "Typecheck the e2e suite"
      run: "npm run typecheck"

    - name: "Unit tests for the compat tooling"
      run: "npm run test:compat-unit"

  playwright:
    name: "WP ${{ matrix.wp }} / PHP ${{ matrix.php }} E2E"
    runs-on: "ubuntu-latest"
    timeout-minutes: 60
    # Development WordPress (master) is upstream code that shouldn't
    # block the rest of the test matrix if it fails.
    continue-on-error: ${{ matrix.wp == 'master' }}
    strategy:
      fail-fast: false
      matrix:
        include:
        # .wp-env.json phpVersion - parity with local development.
        - wp: "latest"
          php: "8.3"
        # Top of the supported PHP range.
        - wp: "latest"
          php: "8.4"
        # The bottom of the supported PHP+WP range.
        - wp: "5.9"
          php: "7.4"
        # Development WordPress, for early warning on upstream core changes.
        - wp: "master"
          php: "8.4"

    steps:
    - name: "Checkout"
      uses: "actions/checkout@v7"

    - name: "Set up the test environment"
      uses: "./.github/actions/e2e-env"
      with:
        wp: "${{ matrix.wp }}"
        php: "${{ matrix.php }}"

    # "latest" runs the core zip pinned in .wp-env.json, which is the version
    # the baseline records. The suite runs even when this check fails.
    - name: "Core surface snapshot"
      id: "snapshot"
      if: "matrix.wp == 'latest' && matrix.php == '8.3'"
      continue-on-error: true
      run: "npm run compat:check"

    - name: "Browser suite"
      run: "npm run test:e2e"

    # Always, not just on failure: a PHP notice or deprecation usually breaks
    # no assertion, so on a green run it would otherwise never be seen — and
    # catching those across PHP 7.4 to 8.4 is most of why this matrix exists.
    - name: "Collect the WordPress debug log"
      if: always()
      continue-on-error: true
      run: |
        mkdir -p artifacts
        npx wp-env run tests-cli -- cat /var/www/html/wp-content/debug.log > artifacts/debug.log 2>/dev/null || true

    - name: "Check the debug log for PHP diagnostics"
      if: always()
      run: |
        test -s artifacts/debug.log || exit 0

        if grep -qE "PHP (Warning|Deprecated|Notice)" artifacts/debug.log; then
          echo "::warning title=PHP diagnostics::WP ${{ matrix.wp }} / PHP ${{ matrix.php }} logged PHP diagnostics; see the debug.log artifact."
          grep -E "PHP (Warning|Deprecated|Notice)" artifacts/debug.log | sort -u | head -40
        fi

        if grep -q "PHP Fatal error" artifacts/debug.log; then
          echo "::error title=PHP fatal::A PHP fatal error was logged during the run."
          grep "PHP Fatal error" artifacts/debug.log | sort -u | head -20
          exit 1
        fi

    - name: "Upload artifacts"
      if: always()
      uses: "actions/upload-artifact@v4"
      with:
        name: "e2e-wp${{ matrix.wp }}-php${{ matrix.php }}-${{ github.run_id }}"
        path: "artifacts/"
        retention-days: 7

    - name: "Fail when the snapshot check failed"
      if: "always() && steps.snapshot.outcome == 'failure'"
      run: |
        echo "::error title=Core surface::The core surface differs from the baseline; see artifacts/surface-diff.md."
        exit 1
