name: "Deploy to WordPress.org"

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  # Deploys only once Integrate has succeeded on the tagged commit, and runs
  # in the wordpress-org environment, which should have a required reviewer.
  # E2E Tests is not required: it runs on pull requests only, so a commit
  # tagged on stable never has an E2E run of its own.
  deploy:
    uses: "joshuadavidnelson/ci/.github/workflows/wp-deploy.yml@v1"
    permissions:
      actions: read
      contents: read
    with:
      slug: "disable-blog"
      required-workflows: |
        Integrate
    secrets: inherit
