name: "Integrate"

on:
  pull_request: null
  push:
    branches:
      - "stable"

jobs:
  syntax-check:
    name: "Syntax check on all PHP versions"
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        php-versions: ['7.4', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"
    - name: "Install PHP"
      uses: "shivammathur/setup-php@v2"
      with:
        php-version: ${{ matrix.php-versions }}
    - name: "Cache Composer dependencies"
      uses: "actions/cache@v6"
      with:
        path: "vendor"
        key: "composer-${{ matrix.php-versions }}-${{ hashFiles('composer.lock') }}"
        restore-keys: |
          composer-${{ matrix.php-versions }}-
          composer-
    - name: "Install dependencies"
      run: "composer install --ignore-platform-reqs"
    - name: "PHP lint"
      run: "composer lint"

  coding-standard:
    name: "Check coding standard"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"
    - name: "Install PHP"
      uses: "shivammathur/setup-php@v2"
      with:
        php-version: "8.4"
    - name: "Cache Composer dependencies"
      uses: "actions/cache@v6"
      with:
        path: "vendor"
        key: "composer-8.4-${{ hashFiles('composer.lock') }}"
        restore-keys: |
          composer-8.4-
          composer-
    - name: "Install PHPCS"
      run: |
        composer install
    - name: "Run PHPCS"
      run: "composer phpcs"

  static-analysis:
    name: "Run static analysis"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"
    - name: "Install PHP"
      uses: "shivammathur/setup-php@v2"
      with:
        php-version: "8.4"
    - name: "Cache Composer dependencies"
      uses: "actions/cache@v6"
      with:
        path: "vendor"
        key: "composer-8.4-${{ hashFiles('composer.lock') }}"
        restore-keys: |
          composer-8.4-
          composer-
    - name: "Install PHPStan"
      run: "composer install"
    - name: "Run PHPStan"
      run: "composer phpstan"

  npm-audit:
    name: "npm install and audit on Node 24"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"
    - name: "Install Node"
      uses: "actions/setup-node@v6"
      with:
        node-version: "24"
        check-latest: true
        cache: "npm"
    - name: "Install npm dependencies"
      run: "npm ci"
    - name: "Audit npm dependencies"
      run: "npm audit --audit-level=high"
    - name: "Check that wp-env loads"
      run: "npx --no-install wp-env --version"
