name: "Integrate"

on:
  pull_request: null
  push:
    branches:
      - "stable"

jobs:
  syntax-check:
    name: "Syntax check on all PHP versions"
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        php-versions: ['7.4', '8.1', '8.2', '8.3', '8.4']
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v4"
    - name: "Install PHP"
      uses: "shivammathur/setup-php@v2"
      with:
        php-version: ${{ matrix.php-versions }}
    - name: "Install dependencies"
      run: "composer install --ignore-platform-reqs"
    - name: "PHP lint"
      run: "composer lint"

  coding-standard:
    name: "Check coding standard"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v4"
    - name: "Install PHP"
      uses: "shivammathur/setup-php@v2"
      with:
        php-version: "8.4"
    - name: "Install PHPCS"
      run: |
        composer install
    - name: "Run PHPCS"
      run: "composer phpcs"

  static-analysis:
    name: "Run static analysis"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v4"
    - name: "Install PHP"
      uses: "shivammathur/setup-php@v2"
      with:
        php-version: "8.4"
    - name: "Install PHPStan"
      run: "composer install"
    - name: "Run PHPStan"
      run: "composer phpstan"
