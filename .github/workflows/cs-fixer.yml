name: "Coding Standards"

on:
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  # Runs phpcbf with phpcs.xml (the standard Integrate checks) and opens a
  # PR with any fixes.
  fix:
    uses: "joshuadavidnelson/ci/.github/workflows/cs-fixer.yml@v1"
    permissions:
      contents: write
      pull-requests: write
    with:
      add-paths: |
        *.php
        includes/
